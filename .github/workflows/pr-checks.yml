name: PR Checks

on:
  push:
    branches:
      - '**'
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline checks
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --locked -- -D warnings

      - name: Run library unit tests
        run: cargo test --locked --lib

      - name: Run offline test targets
        run: >-
          cargo test --locked
          --test mock_transport_test
          --test client_tests
          --test error_tests
          --test utils_tests
          --test test_harness

      - name: Run doctests
        run: cargo test --locked --doc

  live:
    name: Live API tests
    runs-on: ubuntu-latest
    needs: offline
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-live-tests')

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run endpoint tests
        run: cargo test --locked --test endpoint_tests -- --test-threads=1

      - name: Run conditional fetching tests
        run: cargo test --locked --test conditional_fetching_test -- --test-threads=1

      - name: Run conditional fetching endpoint tests
        run: cargo test --locked --test conditional_fetching_endpoints_test -- --test-threads=1

      - name: Run custom query tests
        run: cargo test --locked --test custom_query_test -- --test-threads=1
