query MediaSearch(
    # Basic filters
    $id: Int
    $idMal: Int
    $search: String
    $mediaType: MediaType
    $format: MediaFormat
    $status: MediaStatus
    $season: MediaSeason
    $seasonYear: Int
    $genre: String
    $tag: String
    $tagCategory: String
    $minimumTagRank: Int
    $source: MediaSource
    $countryOfOrigin: CountryCode
    $countryOfOriginIn: [CountryCode]
    $countryOfOriginNotIn: [CountryCode]
    $isLicensed: Boolean
    $isAdult: Boolean
    $onList: Boolean
    $licensedBy: String
    $licensedById: Int

    # NOT filters
    $idNot: Int
    $idIn: [Int]
    $idNotIn: [Int]
    $idMalNot: Int
    $idMalIn: [Int]
    $idMalNotIn: [Int]
    $formatNot: MediaFormat
    $formatIn: [MediaFormat]
    $formatNotIn: [MediaFormat]
    $statusNot: MediaStatus
    $statusIn: [MediaStatus]
    $statusNotIn: [MediaStatus]
    $genreIn: [String]
    $genreNotIn: [String]
    $tagIn: [String]
    $tagNotIn: [String]
    $tagCategoryIn: [String]
    $tagCategoryNotIn: [String]
    $licensedByIn: [String]
    $licensedByIdIn: [Int]
    $sourceIn: [MediaSource]

    # Date filters
    $startDate: FuzzyDateInt
    $endDate: FuzzyDateInt
    $startDateGreater: FuzzyDateInt
    $startDateLesser: FuzzyDateInt
    $startDateLike: String
    $endDateGreater: FuzzyDateInt
    $endDateLesser: FuzzyDateInt
    $endDateLike: String

    # Range filters
    $averageScore: Int
    $averageScoreNot: Int
    $averageScoreGreater: Int
    $averageScoreLesser: Int
    $popularity: Int
    $popularityNot: Int
    $popularityGreater: Int
    $popularityLesser: Int
    $episodes: Int
    $episodesGreater: Int
    $episodesLesser: Int
    $duration: Int
    $durationGreater: Int
    $durationLesser: Int
    $chapters: Int
    $chaptersGreater: Int
    $chaptersLesser: Int
    $volumes: Int
    $volumesGreater: Int
    $volumesLesser: Int

    # Pagination & sorting
    $sort: [MediaSort]
    $page: Int = 1
    $perPage: Int = 20

    # Extra
    $descriptionAsHtml: Boolean = false
    $includeStartDate: Boolean = false
    $includeEndDate: Boolean = false
    $includeDuration: Boolean = false
    $includeVolumes: Boolean = false
    $includeCountryOfOrigin: Boolean = false
    $includeIsLicensed: Boolean = false
    $includeSource: Boolean = false
    $includeHashtag: Boolean = false
    $includeTrailer: Boolean = false
    $includeUpdatedAt: Boolean = false
    $includeCoverImageExtraLarge: Boolean = false
    $includeMeanScore: Boolean = false
    $includeIsLocked: Boolean = false
    $includeTrending: Boolean = false
    $includeTags: Boolean = false
    $includeNextAiringEpisode: Boolean = false
    $includeRelations: Boolean = false
    $includeCharacters: Boolean = false
    $includeStaff: Boolean = false
    $includeStudios: Boolean = false
    $includeMediaListEntryDetails: Boolean = false
    $includeReviews: Boolean = false
    $includeRecommendations: Boolean = false
    $includeExternalLinks: Boolean = false
    $includeStreamingEpisodes: Boolean = false
    $includeRankings: Boolean = false
    $includeStats: Boolean = false
    $includeAutoCreateForumThread: Boolean = false
    $includeIsRecommendationBlocked: Boolean = false
    $includeIsReviewBlocked: Boolean = false
    $includeModNotes: Boolean = false
    # Pagination
    $charactersPage: Int = 1
    $charactersPerPage: Int = 10
    $staffPage: Int = 1
    $staffPerPage: Int = 10
    $reviewsPage: Int = 1
    $reviewsPerPage: Int = 10
    $recommendationsPage: Int = 1
    $recommendationsPerPage: Int = 10
    # Included connection filters
    $voiceActorLanguage: StaffLanguage
) {
    Page(page: $page, perPage: $perPage) {
        pageInfo {
            total
            currentPage
            lastPage
            hasNextPage
            perPage
        }
        media(
            id: $id
            idMal: $idMal
            search: $search
            type: $mediaType
            format: $format
            status: $status
            season: $season
            seasonYear: $seasonYear
            startDate: $startDate
            endDate: $endDate
            genre: $genre
            tag: $tag
            tagCategory: $tagCategory
            minimumTagRank: $minimumTagRank
            source: $source
            countryOfOrigin: $countryOfOrigin
            countryOfOrigin_in: $countryOfOriginIn
            countryOfOrigin_not_in: $countryOfOriginNotIn
            isLicensed: $isLicensed
            isAdult: $isAdult
            onList: $onList
            licensedBy: $licensedBy
            licensedById: $licensedById
            id_not: $idNot
            id_in: $idIn
            id_not_in: $idNotIn
            idMal_not: $idMalNot
            idMal_in: $idMalIn
            idMal_not_in: $idMalNotIn
            format_not: $formatNot
            format_in: $formatIn
            format_not_in: $formatNotIn
            status_not: $statusNot
            status_in: $statusIn
            status_not_in: $statusNotIn
            genre_in: $genreIn
            genre_not_in: $genreNotIn
            tag_in: $tagIn
            tag_not_in: $tagNotIn
            tagCategory_in: $tagCategoryIn
            tagCategory_not_in: $tagCategoryNotIn
            licensedBy_in: $licensedByIn
            licensedById_in: $licensedByIdIn
            source_in: $sourceIn
            startDate_greater: $startDateGreater
            startDate_lesser: $startDateLesser
            startDate_like: $startDateLike
            endDate_greater: $endDateGreater
            endDate_lesser: $endDateLesser
            endDate_like: $endDateLike
            averageScore: $averageScore
            averageScore_not: $averageScoreNot
            averageScore_greater: $averageScoreGreater
            averageScore_lesser: $averageScoreLesser
            popularity: $popularity
            popularity_not: $popularityNot
            popularity_greater: $popularityGreater
            popularity_lesser: $popularityLesser
            episodes: $episodes
            episodes_greater: $episodesGreater
            episodes_lesser: $episodesLesser
            duration: $duration
            duration_greater: $durationGreater
            duration_lesser: $durationLesser
            chapters: $chapters
            chapters_greater: $chaptersGreater
            chapters_lesser: $chaptersLesser
            volumes: $volumes
            volumes_greater: $volumesGreater
            volumes_lesser: $volumesLesser
            sort: $sort
        ) {
            id
            idMal
            title {
                romaji
                english
                native
                userPreferred
            }
            type
            format
            status
            description(asHtml: $descriptionAsHtml)
            startDate @include(if: $includeStartDate) {
                year
                month
                day
            }
            endDate @include(if: $includeEndDate) {
                year
                month
                day
            }
            season
            seasonYear
            episodes
            duration @include(if: $includeDuration)
            chapters
            volumes @include(if: $includeVolumes)
            countryOfOrigin @include(if: $includeCountryOfOrigin)
            isLicensed @include(if: $includeIsLicensed)
            source @include(if: $includeSource)
            hashtag @include(if: $includeHashtag)
            trailer @include(if: $includeTrailer) {
                id
                site
                thumbnail
            }
            updatedAt @include(if: $includeUpdatedAt)
            coverImage {
                extraLarge @include(if: $includeCoverImageExtraLarge)
                large
                medium
                color
            }
            bannerImage
            genres
            synonyms
            averageScore
            meanScore @include(if: $includeMeanScore)
            popularity
            isLocked @include(if: $includeIsLocked)
            trending @include(if: $includeTrending)
            favourites
            tags @include(if: $includeTags) {
                id
                name
                description
                category
                rank
                isGeneralSpoiler
                isMediaSpoiler
                isAdult
                userId
            }
            relations @include(if: $includeRelations) {
                edges {
                    id
                    relationType
                    node {
                        id
                        title {
                            romaji
                            english
                            native
                            userPreferred
                        }
                        type
                        format
                        status
                        coverImage {
                            large
                        }
                    }
                }
            }
            characters(page: $charactersPage, perPage: $charactersPerPage, sort: ROLE) @include(if: $includeCharacters) {
                pageInfo {
                    total
                    perPage
                    currentPage
                    lastPage
                    hasNextPage
                }
                edges {
                    id
                    role
                    name
                    voiceActorRoles(language: $voiceActorLanguage) {
                        voiceActor {
                            id
                            name {
                                first
                                middle
                                last
                                full
                                native
                                alternative
                                userPreferred
                            }
                            language
                            image {
                                large
                            }
                        }
                        roleNotes
                        dubGroup
                    }
                    node {
                        id
                        name {
                            first
                            middle
                            last
                            full
                            native
                            alternative
                            userPreferred
                        }
                        image {
                            large
                        }
                    }
                }
            }
            staff(page: $staffPage, perPage: $staffPerPage, sort: ROLE) @include(if: $includeStaff) {
                pageInfo {
                    total
                    perPage
                    currentPage
                    lastPage
                    hasNextPage
                }
                edges {
                    id
                    role
                    node {
                        id
                        name {
                            first
                            middle
                            last
                            full
                            native
                            alternative
                            userPreferred
                        }
                        image {
                            large
                        }
                        primaryOccupations
                    }
                }
            }
            studios(isMain: true) {
                edges {
                    node {
                        id
                        name
                        siteUrl
                    }
                }
            }
            fullStudios: studios @include(if: $includeStudios) {
                edges {
                    id
                    isMain
                    node {
                        id
                        name
                        isAnimationStudio
                        siteUrl
                        favourites
                    }
                }
            }
            isFavourite
            isFavouriteBlocked
            isAdult
            nextAiringEpisode @include(if: $includeNextAiringEpisode) {
                id
                airingAt
                timeUntilAiring
                episode
            }
            mediaListEntry {
                id
                status
                score
                progress
                progressVolumes @include(if: $includeMediaListEntryDetails)
                repeat @include(if: $includeMediaListEntryDetails)
                priority @include(if: $includeMediaListEntryDetails)
                notes @include(if: $includeMediaListEntryDetails)
                hiddenFromStatusLists @include(if: $includeMediaListEntryDetails)
                customLists @include(if: $includeMediaListEntryDetails)
                advancedScores @include(if: $includeMediaListEntryDetails)
                startedAt @include(if: $includeMediaListEntryDetails) {
                    year
                    month
                    day
                }
                completedAt @include(if: $includeMediaListEntryDetails) {
                    year
                    month
                    day
                }
                updatedAt @include(if: $includeMediaListEntryDetails)
                createdAt @include(if: $includeMediaListEntryDetails)
            }
            reviews(page: $reviewsPage, perPage: $reviewsPerPage, sort: RATING_DESC) @include(if: $includeReviews) {
                 pageInfo {
                    total
                    perPage
                    currentPage
                    lastPage
                    hasNextPage
                }
                nodes {
                    id
                    summary
                    rating
                    ratingAmount
                    userRating
                    score
                    user {
                        id
                        name
                        avatar {
                            large
                        }
                    }
                }
            }
            recommendations(page: $recommendationsPage, perPage: $recommendationsPerPage, sort: RATING_DESC) @include(if: $includeRecommendations) {
                 pageInfo {
                    total
                    perPage
                    currentPage
                    lastPage
                    hasNextPage
                }
                nodes {
                    id
                    rating
                    userRating
                    mediaRecommendation {
                        id
                        title {
                            romaji
                            english
                            native
                            userPreferred
                        }
                        type
                        format
                        status
                        coverImage {
                            large
                        }
                    }
                    user {
                        id
                        name
                        avatar {
                            large
                        }
                    }
                }
            }
            externalLinks @include(if: $includeExternalLinks) {
                id
                url
                site
                siteId
                type
                language
                color
                icon
                notes
                isDisabled
            }
            streamingEpisodes @include(if: $includeStreamingEpisodes) {
                title
                thumbnail
                url
                site
            }
            rankings @include(if: $includeRankings) {
                id
                rank
                type
                format
                year
                season
                allTime
                context
            }
            stats @include(if: $includeStats) {
                scoreDistribution {
                    score
                    amount
                }
                statusDistribution {
                    status
                    amount
                }
            }
            siteUrl
            autoCreateForumThread @include(if: $includeAutoCreateForumThread)
            isRecommendationBlocked @include(if: $includeIsRecommendationBlocked)
            isReviewBlocked @include(if: $includeIsReviewBlocked)
            modNotes @include(if: $includeModNotes)
        }
    }
}
