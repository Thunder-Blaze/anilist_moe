fragment UserFields on User {
    id
    name
    avatar {
        large
    }
}

fragment MediaFields on Media {
    id
    title {
        userPreferred
    }
    coverImage {
        large
    }
}

query FetchActivity(
    # Pagination
    $page: Int,
    $perPage: Int = 30,

    # Filters
    $id: Int,
    $userId: Int,
    $messengerId: Int,
    $mediaId: Int,
    $type: ActivityType,
    $isFollowing: Boolean,
    $hasReplies: Boolean,
    $hasRepliesOrTypeText: Boolean,
    $createdAt: Int,
    $idNot: Int,
    $idIn: [Int],
    $idNotIn: [Int],
    $userIdNot: Int,
    $userIdIn: [Int],
    $userIdNotIn: [Int],
    $messengerIdNot: Int,
    $messengerIdIn: [Int],
    $messengerIdNotIn: [Int],
    $mediaIdNot: Int,
    $mediaIdIn: [Int],
    $mediaIdNotIn: [Int],
    $typeNot: ActivityType,
    $typeIn: [ActivityType],
    $typeNotIn: [ActivityType],
    $createdAtGreater: Int,
    $createdAtLesser: Int,

    # Sort
    $sort: [ActivitySort] = [ID_DESC]

    # HTML rendering options
    $textAsHtml: Boolean = false
    $messageAsHtml: Boolean = false
) {
    Page(page: $page, perPage: $perPage) {
        pageInfo {
            hasNextPage
        }
        activities(
            id: $id,
            userId: $userId,
            messengerId: $messengerId,
            mediaId: $mediaId,
            type: $type,
            isFollowing: $isFollowing,
            hasReplies: $hasReplies,
            hasRepliesOrTypeText: $hasRepliesOrTypeText,
            createdAt: $createdAt,
            id_not: $idNot,
            id_in: $idIn,
            id_not_in: $idNotIn,
            userId_not: $userIdNot,
            userId_in: $userIdIn,
            userId_not_in: $userIdNotIn,
            messengerId_not: $messengerIdNot,
            messengerId_in: $messengerIdIn,
            messengerId_not_in: $messengerIdNotIn,
            mediaId_not: $mediaIdNot,
            mediaId_in: $mediaIdIn,
            mediaId_not_in: $mediaIdNotIn,
            type_not: $typeNot,
            type_in: $typeIn,
            type_not_in: $typeNotIn,
            createdAt_greater: $createdAtGreater,
            createdAt_lesser: $createdAtLesser,
            sort: $sort
        ) {
            __typename
            ... on ListActivity {
                id
                type
                createdAt
                isLiked
                likeCount
                replyCount
                isSubscribed
                status
                progress
                user {
                    ...UserFields
                }
                likes {
                    ...UserFields
                }
                media {
                    ...MediaFields
                }
            }
            ... on TextActivity {
                id
                type
                createdAt
                isLiked
                likeCount
                replyCount
                isSubscribed
                text(asHtml: $textAsHtml)
                user {
                    ...UserFields
                }
                likes {
                    ...UserFields
                }
            }
            ... on MessageActivity {
                id
                type
                createdAt
                isLiked
                likeCount
                replyCount
                isSubscribed
                message(asHtml: $messageAsHtml)
                messenger {
                    ...UserFields
                }
                recipient {
                    ...UserFields
                }
                likes {
                    ...UserFields
                }
            }
        }
    }
}
