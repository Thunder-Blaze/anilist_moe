mutation ToggleActivityPin($id: Int!, $pinned: Boolean!) {
    ToggleActivityPin(id: $id, pinned: $pinned) {
        __typename
        ... on ListActivity {
            id
            type
            isPinned
        }
        ... on TextActivity {
            id
            type
            isPinned
        }
        ... on MessageActivity {
            id
            type
            isPinned
        }
    }
}
