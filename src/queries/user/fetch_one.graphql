query GetUserById(
    $id: Int!
    $name: String
    $search: String
    $isModerator: Boolean
    $sort: [UserSort]
    $aboutAsHtml: Boolean = false
) {
    User(id: $id, name: $name, search: $search, isModerator: $isModerator, sort: $sort) {
        id
        name
        about(asHtml: $aboutAsHtml)
        avatar {
            large
            medium
        }
        bannerImage
        siteUrl
        createdAt
        updatedAt
        isFollowing
        isFollower
        isBlocked
        bans
        options {
            titleLanguage
            displayAdultContent
            airingNotifications
            profileColor
        }
        mediaListOptions {
            scoreFormat
            rowOrder
            animeList {
                sectionOrder
                splitCompletedSectionByFormat
                customLists
                advancedScoring
                advancedScoringEnabled
            }
            mangaList {
                sectionOrder
                splitCompletedSectionByFormat
                customLists
                advancedScoring
                advancedScoringEnabled
            }
        }
        unreadNotificationCount
        donatorTier
        donatorBadge
        moderatorRoles
    }
}
