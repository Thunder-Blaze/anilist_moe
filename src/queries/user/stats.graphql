query GetUserStats($userId: Int!, $sort: [UserStatisticsSort]) {
    User(id: $userId) {
        id
        name
        statistics {
            anime {
                count
                meanScore
                standardDeviation
                minutesWatched
                episodesWatched
                chaptersRead
                volumesRead
                formats(sort: $sort) {
                    format
                    count
                }
                statuses(sort: $sort) {
                    status
                    count
                }
                scores(sort: $sort) {
                    score
                    count
                }
                lengths(sort: $sort) {
                    length
                    count
                }
                releaseYears(sort: $sort) {
                    releaseYear
                    count
                }
                startYears(sort: $sort) {
                    startYear
                    count
                }
                genres(sort: $sort) {
                    genre
                    count
                    meanScore
                    minutesWatched
                }
                tags(sort: $sort) {
                    tag {
                        id
                        name
                    }
                    count
                    meanScore
                    minutesWatched
                }
                countries(sort: $sort) {
                    country
                    count
                    meanScore
                    minutesWatched
                }
                voiceActors(sort: $sort) {
                    voiceActor {
                        id
                        name {
                            first
                            middle
                            last
                            full
                            native
                        }
                    }
                    count
                    meanScore
                    minutesWatched
                }
                staff(sort: $sort) {
                    staff {
                        id
                        name {
                            first
                            middle
                            last
                            full
                            native
                        }
                    }
                    count
                    meanScore
                    minutesWatched
                }
                studios(sort: $sort) {
                    studio {
                        id
                        name
                    }
                    count
                    meanScore
                    minutesWatched
                }
            }
            manga {
                count
                meanScore
                standardDeviation
                chaptersRead
                volumesRead
                formats(sort: $sort) {
                    format
                    count
                }
                statuses(sort: $sort) {
                    status
                    count
                }
                scores(sort: $sort) {
                    score
                    count
                }
                lengths(sort: $sort) {
                    length
                    count
                }
                releaseYears(sort: $sort) {
                    releaseYear
                    count
                }
                startYears(sort: $sort) {
                    startYear
                    count
                }
                genres(sort: $sort) {
                    genre
                    count
                    meanScore
                    chaptersRead
                }
                tags(sort: $sort) {
                    tag {
                        id
                        name
                    }
                    count
                    meanScore
                    chaptersRead
                }
                countries(sort: $sort) {
                    country
                    count
                    meanScore
                    chaptersRead
                }
                staff(sort: $sort) {
                    staff {
                        id
                        name {
                            first
                            middle
                            last
                            full
                            native
                        }
                    }
                    count
                    meanScore
                    chaptersRead
                }
            }
        }
    }
}
