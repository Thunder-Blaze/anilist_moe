query GetUserMangaList(
    $id: Int
    $userId: Int
    $username: String
    $page: Int = 1
    $perPage: Int = 25
    $status: MediaListStatus
    $statusIn: [MediaListStatus]
    $statusNot: MediaListStatus
    $statusNotIn: [MediaListStatus]
    $mediaId: Int
    $mediaIdIn: [Int]
    $mediaIdNotIn: [Int]
    $userIdIn: [Int]
    $isFollowing: Boolean
    $compareWithAuthList: Boolean
    $notes: String
    $startedAtExact: FuzzyDateInt
    $startedAtGreater: FuzzyDateInt
    $startedAtLesser: FuzzyDateInt
    $startedAt: String
    $completedAtExact: FuzzyDateInt
    $completedAtGreater: FuzzyDateInt
    $completedAtLesser: FuzzyDateInt
    $completedAt: String
    $sort: [MediaListSort]
    $mediaType: MediaType
) {
    Page(page: $page, perPage: $perPage) {
        pageInfo {
            hasNextPage
        }
        mediaList(
            id: $id
            userId: $userId
            userName: $username
            type: $mediaType
            status: $status
            status_in: $statusIn
            status_not: $statusNot
            status_not_in: $statusNotIn
            mediaId: $mediaId
            mediaId_in: $mediaIdIn
            mediaId_not_in: $mediaIdNotIn
            userId_in: $userIdIn
            isFollowing: $isFollowing
            compareWithAuthList: $compareWithAuthList
            notes_like: $notes
            startedAt: $startedAtExact
            startedAt_greater: $startedAtGreater
            startedAt_lesser: $startedAtLesser
            startedAt_like: $startedAt
            completedAt: $completedAtExact
            completedAt_greater: $completedAtGreater
            completedAt_lesser: $completedAtLesser
            completedAt_like: $completedAt
            sort: $sort
        ) {
            id
            userId
            mediaId
            status
            score
            progress
            progressVolumes
            repeat
            priority
            private
            notes
            hiddenFromStatusLists
            customLists
            advancedScores
            startedAt {
                year
                month
                day
            }
            completedAt {
                year
                month
                day
            }
            updatedAt
            createdAt
            media {
                id
                title {
                    romaji
                    english
                    native
                    userPreferred
                }
                coverImage {
                    extraLarge
                    large
                    medium
                    color
                }
                type
                format
                status
                episodes
                duration
                chapters
                volumes
                averageScore
                popularity
                genres
                staff {
                    edges {
                        node {
                            id
                            name {
                                userPreferred
                            }
                        }
                        role
                    }
                }
                startDate {
                    year
                    month
                    day
                }
                endDate {
                    year
                    month
                    day
                }
                isAdult
                countryOfOrigin
                siteUrl
            }
            user {
                id
                name
            }
        }
    }
}
