query FetchThread(
    $id: Int!
    $userId: Int
    $replyUserId: Int
    $subscribed: Boolean
    $categoryId: Int
    $mediaCategoryId: Int
    $search: String
    $idIn: [Int]
    $sort: [ThreadSort]
    $bodyAsHtml: Boolean = false
) {
    Thread(
        id: $id
        userId: $userId
        replyUserId: $replyUserId
        subscribed: $subscribed
        categoryId: $categoryId
        mediaCategoryId: $mediaCategoryId
        search: $search
        id_in: $idIn
        sort: $sort
    ) {
        id
        title
        body(asHtml: $bodyAsHtml)
        userId
        replyUserId
        replyCount
        viewCount
        replyCommentId
        repliedAt
        createdAt
        updatedAt
        isLocked
        isSticky
        isSubscribed
        likeCount
        isLiked
        siteUrl
        categories {
            id
            name
        }
        mediaCategories {
            id
            title {
                romaji
                english
                native
                userPreferred
            }
            type
            format
            status
            coverImage {
                large
                medium
                color
            }
            bannerImage
        }
        user {
            id
            name
            avatar {
                large
                medium
            }
            donatorTier
            donatorBadge
            moderatorRoles
        }
        replyUser {
            id
            name
            avatar {
                large
                medium
            }
            donatorTier
            donatorBadge
            moderatorRoles
        }
    }
}
