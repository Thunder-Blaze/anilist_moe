query FetchThreadComment(
    $id: Int
    $threadId: Int
    $userId: Int
    $sort: [ThreadCommentSort]
    $commentAsHtml: Boolean = false
) {
    ThreadComment(id: $id, threadId: $threadId, userId: $userId, sort: $sort) {
        id
        threadId
        userId
        comment(asHtml: $commentAsHtml)
        likeCount
        isLiked
        siteUrl
        createdAt
        updatedAt
        isLocked
        thread {
            id
            title
            siteUrl
        }
        user {
            id
            name
            avatar {
                large
                medium
            }
            donatorTier
            donatorBadge
            moderatorRoles
        }
        likes {
            id
            name
            avatar {
                large
                medium
            }
        }
        childComments
        likes {
            id
            name
            avatar {
                medium
            }
        }
    }
}
