[package]
name = "anilist_moe"
version = "0.7.1"
description = "Anilist_Moe is a Rust Wrapper for the Anilist API. This library allows you to seamlessly interact with Anilist's Public API with and without authentication. This currently supports Anime, Manga, Users, Staff, Forum, Threads, Recommendations, Reviews and User Activities"
# Edition 2021 on purpose: edition 2024 requires Rust 1.85, which would raise the
# MSRV above the 1.82 this crate supports.
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/Thunder-Blaze/anilist_moe/"
keywords = ["wrapper", "api", "anilist"]
readme = "README.md"

[dependencies]
# Held at the 0.12 line on purpose: reqwest 0.13 needs Rust 1.85, and its
# `rustls` feature pulls aws-lc-rs, which makes every consumer build C code with
# CMake. 0.12.28 still gets rustls through ring and builds on Rust 1.64.
reqwest = { version = "0.12.28", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# 3.18 and later need Rust 1.88; 3.17 is the newest that keeps the MSRV.
serde_with = "3.17.0"
# Only `time` is needed: the crate sleeps for retry backoff and nothing else. The
# runtime belongs to the caller, and `full` would make every consumer compile io,
# net, fs, process and signal support this crate never touches.
tokio = { version = "1.53.2", features = ["time"] }
thiserror = "2.0.21"
log = "0.4.34"
tracing = { version = "0.1.44", optional = true }
# Held at the 0.22 line on purpose: 0.23 is edition 2024, which needs Rust 1.85,
# and the crate supports 1.82. 0.22 has the setters used here (strip_option with
# ignore_invalid and fallback_suffix) and the `!default` that marks a field required.
typed-builder = "0.22"

# Endpoint feature flags.
#
# Every AniList endpoint group is gated behind its own feature, and `default`
# enables the `full` umbrella so existing users are unaffected. To build a lean
# client, disable default features and opt in to only what you need:
#
# ```toml
# anilist_moe = { version = "0.7", default-features = false, features = ["media", "user"] }
# ```
#
# `cargo build --no-default-features` yields a client with no endpoints at all;
# it still compiles and only loses the accessor methods for the disabled groups.
#
# Feature matrix (feature -> endpoints module -> `AniListClient` accessors):
#
# | Feature          | Endpoints module        | Client accessors                     |
# |------------------|-------------------------|--------------------------------------|
# | `media`          | `endpoints::media`      | `media()`, `anime()`, `manga()`      |
# | `medialist`      | `endpoints::medialist`  | `medialist()`                        |
# | `user`           | `endpoints::user`       | `user()`                             |
# | `character`      | `endpoints::character`  | `character()`                        |
# | `staff`          | `endpoints::staff`      | `staff()`                            |
# | `studio`         | `endpoints::studio`     | `studio()`                           |
# | `forum`          | `endpoints::forum`      | `forum()`                            |
# | `activity`       | `endpoints::activity`   | `activity()`                         |
# | `review`         | `endpoints::review`     | `review()`                           |
# | `recommendation` | `endpoints::recommendation` | `recommendation()`              |
# | `airing`         | `endpoints::airing`     | `airing()`                           |
# | `notification`   | `endpoints::notification` | `notification()`                   |
# | `common`         | `endpoints::common`     | `common()`                           |
# | `full`           | all of the above        | all of the above                     |
[features]
# Enable everything, matching the pre-feature-flag behaviour.
default = ["full"]

# Emit `tracing` spans and events for the request lifecycle. Adds no cost when off.
tracing = ["dep:tracing"]

# Walk the pages of a list query with `Paginator` and `AniListClient::paginate`.
pagination = []

# Umbrella feature pulling in every endpoint group listed below.
full = [
  "media",
  "medialist",
  "user",
  "character",
  "staff",
  "studio",
  "forum",
  "activity",
  "review",
  "recommendation",
  "airing",
  "notification",
  "common",
]

# Anime and manga operations (search, trending, details).
media = []
# User anime/manga list operations.
medialist = []
# User profiles, statistics, favourites, and following.
user = []
# Character operations (search, popular, birthdays).
character = []
# Staff member operations (search, popular, birthdays).
staff = []
# Studio operations (search, productions).
studio = []
# Forum threads, comments, and categories.
forum = []
# Activity feed operations (text posts, list updates, replies).
activity = []
# Review operations (create, read, update, delete).
review = []
# Recommendation operations (browse, manage).
recommendation = []
# Airing schedule operations (upcoming, recently aired).
airing = []
# Notification operations (read, manage).
notification = []
# Common operations (likes, follows, favourites).
common = []

[dev-dependencies]
# Tests and examples drive a runtime of their own, and load tokens from `.env`.
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
dotenvy = "0.15.7"
# Parses every bundled `.graphql` document in a unit test, so a corrupted query
# fails the build instead of every call that sends it.
graphql-parser = "0.4.1"
parking_lot = "0.12.5"
tokio-test = "0.4.6"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Build the optional APIs into the docs on docs.rs, which otherwise only builds
# the default features.
[package.metadata.docs.rs]
all-features = true
